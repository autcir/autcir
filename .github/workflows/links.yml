name: Links

# Separate from `validate` on purpose: whether a third-party site is up is not
# something a pull request should be blocked on. It still fails visibly, on PRs
# that touch Markdown and on a weekly run that catches links that rot later.
on:
  pull_request:
    paths:
      - "**/*.md"
      - ".lychee.toml"
      - ".github/workflows/links.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Link check
    runs-on: [self-hosted, soliso]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          fail: true
